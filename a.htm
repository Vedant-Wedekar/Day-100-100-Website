<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Animation Example</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      flex-direction: column;
      text-align: center;
    }
    [animate] {
      display: inline-block;
      overflow: hidden;
    }
    .word {
      display: inline-block;
      overflow: hidden;
      white-space: pre;
    }
  </style>
</head>
<body>
  <h1 animate>Animating words with GSAP</h1>
  <p animate>This is another example where each word drops in.</p>

  <script src="https://unpkg.com/split-type"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>

  <script>
    let typeSplit = new SplitType('[animate]', {
      types: 'lines, words, chars',
      tagName: 'span'
    });

    gsap.from('[animate] .word', {
      y: '100%',
      opacity: 0,
      duration: 0.5,
      ease: 'power1.out',
      stagger: 0.1,
    });
  </script>
</body>
</html>
